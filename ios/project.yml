name: Previously
# Deployment target is iOS 18.0, not 26.0 and not 17.0. iOS 17 and iOS 18 support the IDENTICAL
# iPhone set (iPhone XR / XS and later, A12+) — Apple kept 17's device list for 18 — while iOS 26
# requires iPhone 11 / SE 2nd gen. So 18 already reaches every phone that 26 excludes, and dropping
# to 17 would buy no extra device while costing the `onGeometryChange` scroll probes (18 sites),
# the `Tab { }` builder and Schedule's `onScrollTargetVisibilityChange` day tracking.
# iOS 26 flourishes are gated in DesignSystem/GlassHelpers.swift, never removed.
options:
  bundleIdPrefix: com.cognipin
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "9"
    # Set SWIFT_STRICT_CONCURRENCY to "complete" once you have validated the build.
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    # Pinned to the latest release at authoring time. Bump as desired.
    from: "1.2.4"

targets:
  Previously:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    # XcodeGen has no separate `resources:` key — resources are `sources` entries it
    # auto-categorizes by file type into the resources build phase.
    sources:
      - path: Sources
      # Types shared with the widget extension (Live Activity attributes) — the file must be a
      # member of both targets so ActivityKit's app/widget halves agree on the payload.
      - path: Shared
      - path: Resources/Assets.xcassets
      # Bundled Outfit font weights (registered via UIAppFonts below). XcodeGen categorizes
      # the .ttf files into the resources build phase automatically.
      - path: Resources/Fonts
      # iOS 26 layered app icon (Icon Composer). `type: file` keeps the .icon package as a
      # single reference (not expanded into icon.json/Assets) so actool processes it.
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
      # Apple privacy manifest (required-reason APIs + collected data types). Explicit
      # type/buildPhase because XcodeGen has no rule for .xcprivacy and would otherwise drop it.
      - path: Resources/PrivacyInfo.xcprivacy
        type: file
        buildPhase: resources
    dependencies:
      # The clerk-ios package vends two products: ClerkKit (core) and ClerkKitUI (prebuilt views).
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      # Widget extension hosting the airing-countdown Live Activity (embedded into PlugIns).
      - target: PreviouslyWidgets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "Previously."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Export compliance, answered at build time so TestFlight/App Store Connect stops asking on
        # every upload. The app ships no cryptography of its own — only HTTPS through the OS, which
        # is exempt under the ATS/standard-crypto exemption. If a future build adds its own crypto,
        # this answer must be revisited.
        ITSAppUsesNonExemptEncryption: false
        # The launch screen is the bare canvas (`LaunchBackground` = `ThemeColor.canvas`) and
        # nothing else: the ident (App/LaunchIdent.swift) owns the whole entrance. A `UIImageName`
        # still from the asset catalogue was tried (4 Sep) and never rendered on the iOS 27
        # simulator — the system composes the launch frame before the catalogue is readable — so
        # a design that continued from it would cut on exactly the devices it was meant for.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # ProMotion: allow display-linked custom animation (the launch ident's TimelineView) to
        # run at up to 120Hz on iPhone — without this key iOS caps custom animation at 60fps.
        CADisableMinimumFrameDurationOnPhone: true
        # Landscape is listed so the SYSTEM video player (the trailer stage's hand-off) can
        # rotate; the app itself stays portrait through `AppDelegate`'s orientation gate.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        # Bundled Outfit weights (files live in Resources/Fonts). Filenames only — XcodeGen
        # flattens the folder into the bundle root.
        UIAppFonts:
          - Outfit-Light.ttf
          - Outfit-Regular.ttf
          - Outfit-Medium.ttf
          - Outfit-SemiBold.ttf
          - Outfit-Bold.ttf
        # Connecting to a server on the local network by private IP requires this
        # permission string (iOS shows a one-time "find devices on your network" prompt;
        # without the key the connection to a 192.168.x.x address fails silently).
        NSLocalNetworkUsageDescription: "Previously. connects to your self-hosted server running on your local network."
        # Production backend is HTTPS (anime.cognipin.com), so ATS needs no cleartext
        # exception for it. NSAllowsLocalNetworking is kept so pointing API_BASE_URL back
        # at a local/LAN dev server (plain http) still works without re-enabling arbitrary loads.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Lock-screen / Dynamic Island airing countdown (AiringLiveActivityManager).
        NSSupportsLiveActivities: true
        # === FILL THESE IN ===
        # Your Clerk publishable key (pk_test_… / pk_live_…). Leave the placeholder
        # to run in dev-bypass mode against the local backend.
        ClerkPublishableKey: "$(CLERK_PUBLISHABLE_KEY)"
        # Backend base URL. Defaults to the local dev server.
        APIBaseURL: "$(API_BASE_URL)"
        # App Store guideline 5.1.1 requires a reachable Privacy Policy, Terms and a support
        # contact. AppConfig treats an unset value or one still containing REPLACE_ME as absent
        # and the Profile screen omits the row, so a placeholder never ships as a broken link.
        PrivacyPolicyURL: "$(PRIVACY_POLICY_URL)"
        TermsURL: "$(TERMS_URL)"
        SupportEmail: "$(SUPPORT_EMAIL)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cognipin.previously
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        # Placeholders read by Info.plist above. Override per-config or in an xcconfig.
        CLERK_PUBLISHABLE_KEY: "pk_test_bGVnaWJsZS1nb2JibGVyLTU3LmNsZXJrLmFjY291bnRzLmRldiQ"
        # Public HTTPS backend (self-hosted on the Mac mini, fronted at this domain).
        # For local development, override with a LAN URL such as
        # "http://Shantanus-MacBook-Air.local:8787" (NSAllowsLocalNetworking permits it).
        API_BASE_URL: "https://anime.cognipin.com"
        # Guideline 5.1.1 — served by the LANDING SITE (landing/, deployed to Vercel), not by the
        # backend. The backend copy (server/src/routes/legal.ts) was the 3 Sep decision, taken
        # before the landing site existed; it put the one URL Apple re-checks on the Mac mini,
        # which is a home machine behind a Cloudflare tunnel. Vercel stays up when the mini does
        # not, and two hand-written copies of the same documents had already drifted (the backend
        # text was dated 3 Sep, the landing text still labelled itself a working draft). One
        # source of truth, on the host that does not go down. Custom domain still to come — the
        # default vercel.app URL is fine for the beta, not for a public listing.
        PRIVACY_POLICY_URL: "https://landing-ten-theta-55.vercel.app/privacy"
        TERMS_URL: "https://landing-ten-theta-55.vercel.app/terms"
        SUPPORT_EMAIL: "shantanusinha95@gmail.com"
        # === SIGNING ===
        DEVELOPMENT_TEAM: YLPZXZS2F4
        CODE_SIGN_STYLE: Automatic

  PreviouslyWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: "Previously."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cognipin.previously.widgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: YLPZXZS2F4
        CODE_SIGN_STYLE: Automatic

# Shared scheme so CLI builds (xcodebuild -scheme Previously) work outside Xcode.
schemes:
  Previously:
    build:
      targets:
        Previously: all
    run:
      config: Debug
